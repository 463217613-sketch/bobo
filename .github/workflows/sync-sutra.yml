name: sync-sutra

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sutra
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: download static site
        run: |
          set -e
          B="https://cart-ham-economic-photograph.trycloudflare.com"
          mkdir -p sutra
          curl -fsSL --retry 5 --retry-delay 3 "$B/index.html" -o sutra/index.html
          curl -fsSL --retry 5 --retry-delay 3 "$B/manifest.webmanifest" -o sutra/manifest.webmanifest
          curl -fsSL --retry 5 --retry-delay 3 "$B/sw.js" -o sutra/sw.js
          for i in 180 192 512; do curl -fsSL --retry 5 --retry-delay 3 "$B/icon-$i.png" -o "sutra/icon-$i.png"; done
          ls -la sutra
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sutra
          git commit -m "sync sutra app" || echo "no changes"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
