name: ios-build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      ICON_URL: https://workbuddy-space-static.codebuddy.work/image/Xt7moLM2qIIKB1PzvX1uLc.jpg
      BUNDLE_ID: com.bobo.workbench
      BUILD_NO: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
      HAS_SIGN: ${{ secrets.IOS_P12_BASE64 != '' }}
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare (xcodegen, icon, version)
        run: |
          set -x
          mkdir -p ios-ci
          brew install xcodegen 2>&1 | tail -n 3
          cd ios
          curl -fsSL "$ICON_URL" -o /tmp/icon.jpg
          sips -s format png /tmp/icon.jpg --out Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: com.bobo.workbench/PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NO\"/" project.yml
          xcodegen generate
          xcodebuild -version | tee ../ios-ci/xcode-version.txt

      - name: Build for simulator (compile check + test target)
        run: |
          set +e
          cd ios
          xcodebuild -project BOBOWorkbench.xcodeproj -scheme BOBOWorkbench -sdk iphonesimulator \
            -configuration Debug -derivedDataPath ../build-sim CODE_SIGNING_ALLOWED=NO build \
            > ../ios-ci/build-sim.log 2>&1
          echo $? > ../ios-ci/rc-sim
          cat ../ios-ci/rc-sim

      - name: Build unsigned device app and package IPA
        run: |
          set +e
          cd ios
          xcodebuild -project BOBOWorkbench.xcodeproj -scheme BOBOWorkbench -sdk iphoneos \
            -configuration Release -derivedDataPath ../build-dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            > ../ios-ci/build-dev.log 2>&1
          echo $? > ../ios-ci/rc-dev
          APP=../build-dev/Build/Products/Release-iphoneos/BOBOWorkbench.app
          if [ -d "$APP" ]; then
            rm -rf Payload BOBO-Workbench-unsigned.ipa
            mkdir -p Payload && cp -R "$APP" Payload/
            zip -qry BOBO-Workbench-unsigned.ipa Payload
            ls -la BOBO-Workbench-unsigned.ipa
            /usr/libexec/PlistBuddy -c "Print" "$APP/Info.plist" > ../ios-ci/app-info-plist.txt 2>&1
            ls "$APP" > ../ios-ci/app-contents.txt
            (xcrun assetutil --info "$APP/Assets.car" 2>/dev/null | grep -E '"Name"|"AppIcon' | head -20) > ../ios-ci/assets-info.txt
          fi

      - name: Simulator smoke test (launch, screenshot, bridge log)
        run: |
          set +e
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 15 \(" | head -1 | grep -oE '[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}')
          echo "UDID=$UDID" | tee ios-ci/sim-udid.txt
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b | tail -n 2
          APP=build-sim/Build/Products/Debug-iphonesimulator/BOBOWorkbench.app
          xcrun simctl install "$UDID" "$APP"
          SIMCTL_CHILD_GT_DEBUG=1 SIMCTL_CHILD_GT_FAKESEED='{"salt":"unit-test-salt","k":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}' \
            xcrun simctl launch "$UDID" "$BUNDLE_ID" | tee ios-ci/sim-launch.txt
          sleep 25
          xcrun simctl io "$UDID" screenshot ios-ci/sim-25s.png
          sleep 20
          xcrun simctl io "$UDID" screenshot ios-ci/sim-45s.png
          C=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          cp "$C/Documents/gt-debug.log" ios-ci/gt-debug.log 2>/dev/null || echo "no debug log" > ios-ci/gt-debug.log
          xcrun simctl terminate "$UDID" "$BUNDLE_ID"

      - name: Signed build (only when Apple signing secrets exist)
        if: env.HAS_SIGN == 'true'
        run: |
          set +e
          cd ios
          echo "$IOS_P12_BASE64" | base64 -d > /tmp/cert.p12
          echo "$IOS_PROFILE_BASE64" | base64 -d > /tmp/p.mobileprovision
          security create-keychain -p ci /tmp/build.keychain
          security default-keychain -s /tmp/build.keychain
          security unlock-keychain -p ci /tmp/build.keychain
          security import /tmp/cert.p12 -k /tmp/build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci /tmp/build.keychain
          security cms -D -i /tmp/p.mobileprovision > /tmp/p.plist
          PNAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/p.plist)
          PUUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/p.plist)
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/p.plist)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/p.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PUUID.mobileprovision"
          IDENT=$(security find-identity -v -p codesigning /tmp/build.keychain | head -1 | sed -E 's/.*"(.*)".*/\1/')
          METHOD=${IOS_EXPORT_METHOD:-ad-hoc}
          xcodebuild archive -project BOBOWorkbench.xcodeproj -scheme BOBOWorkbench -configuration Release \
            -archivePath ../build-signed/App.xcarchive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PNAME" CODE_SIGN_IDENTITY="$IDENT" \
            > ../ios-ci/build-signed.log 2>&1
          echo $? > ../ios-ci/rc-signed
          cat > /tmp/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PNAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath ../build-signed/App.xcarchive -exportPath ../build-signed/out \
            -exportOptionsPlist /tmp/export.plist >> ../ios-ci/build-signed.log 2>&1
          echo $? >> ../ios-ci/rc-signed
          IPA=$(ls ../build-signed/out/*.ipa 2>/dev/null | head -1)
          [ -n "$IPA" ] && cp "$IPA" BOBO-Workbench-signed.ipa

      - name: Publish IPA to Release
        if: always()
        run: |
          set +e
          cd ios
          FILES=""
          [ -f BOBO-Workbench-unsigned.ipa ] && FILES="$FILES BOBO-Workbench-unsigned.ipa"
          [ -f BOBO-Workbench-signed.ipa ] && FILES="$FILES BOBO-Workbench-signed.ipa"
          if [ -n "$FILES" ]; then
            gh release create "ios-build-$BUILD_NO" $FILES --repo "$GITHUB_REPOSITORY" \
              --title "BOBO工作台 iOS 构建 #$BUILD_NO" \
              --notes "由 GitHub Actions 自动构建。unsigned 版需用 Sideloadly/AltStore 等工具用你自己的 Apple ID 签名后安装；signed 版仅在配置了 Apple 签名密钥时生成。" \
              2>&1 | tee ../ios-ci/release.txt
          fi

      - name: Commit CI status back (small files only)
        if: always()
        run: |
          set +e
          for f in build-sim build-dev build-signed; do
            [ -f ios-ci/$f.log ] && tail -n 150 ios-ci/$f.log > ios-ci/$f.tail.txt
            rm -f ios-ci/$f.log
          done
          RS=$(cat ios-ci/rc-sim 2>/dev/null | head -1); RD=$(cat ios-ci/rc-dev 2>/dev/null | head -1)
          echo "{\"run\": $BUILD_NO, \"sha\": \"$GITHUB_SHA\", \"rc_sim\": \"$RS\", \"rc_dev\": \"$RD\", \"time\": \"$(date -u +%FT%TZ)\"}" > ios-ci/status.json
          if [ "$RS" = "0" ] && [ "$RD" = "0" ]; then
            echo "{ \"build\": $BUILD_NO }" > ios/latest.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ios-ci ios/latest.json
          git commit -m "ci: ios build #$BUILD_NO status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
